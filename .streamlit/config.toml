[theme]
base                     = "light"
primaryColor             = "#2563EB"
backgroundColor          = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor                = "#1E293B"
font                     = "sans serif"

[server]
headless     = true
port         = 8501
enableCORS   = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
